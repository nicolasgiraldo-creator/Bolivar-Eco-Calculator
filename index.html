<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolívar Eco-Calculator</title>
</head>
<body>

    <h1>Bolívar Eco-Calculator</h1>
    <p>Calculate your weekly environmental footprint.</p>

    <form id="ecoForm">

        <label for="transport">Transportation to school:</label>
        <select id="transport" required>
            <option value="bus">Bus</option>
            <option value="car">Private car</option>
            <option value="shared">Shared car</option>
            <option value="bike">Bicycle / Walking</option>
        </select>

        <br><br>

        <label for="paper">Paper sheets used per day:</label>
        <input type="number" id="paper" min="0" step="1" required>

        <br><br>

        <label for="recycling">Recycling level:</label>
        <select id="recycling" required>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select>

        <br><br>

        <button type="submit">Calculate Footprint</button>

    </form>

    <h2>Weekly Results</h2>
    <p id="co2Result">Weekly CO2: -- kg</p>
    <p id="pointsResult">Eco-Points: --</p>

    <script>
        const form = document.getElementById("ecoForm");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const transport = document.getElementById("transport").value;
            const paper = Number(document.getElementById("paper").value);
            const recycling = document.getElementById("recycling").value;

            if (!Number.isInteger(paper) || paper < 0) {
                alert("Please enter a valid number of paper sheets.");
                return;
            }

            // Assumptions: 10 km round trip per day, 5 school days.
            const weeklyDistance = 50;

            // Illustrative transport emission factors (kg CO2 per km).
            const emissionFactors = {
                bus: 0.089,
                car: 0.192,
                shared: 0.096,
                bike: 0
            };

            const transportCO2 =
                emissionFactors[transport] * weeklyDistance;

            // Estimated paper emissions: 0.005 kg per sheet.
            const recyclingFactors = {
                low: 1,
                medium: 0.85,
                high: 0.70
            };

            const paperCO2 =
                paper * 5 * 0.005 * recyclingFactors[recycling];

            const totalCO2 = transportCO2 + paperCO2;

            // Eco-Points calculation.
            const transportPoints = {
                bike: 40,
                bus: 30,
                shared: 20,
                car: 10
            };

            const paperPoints = Math.max(0, 30 - paper * 0.5);

            const recyclingPoints = {
                low: 10,
                medium: 20,
                high: 30
            };

            const ecoPoints = Math.round(
                transportPoints[transport] +
                paperPoints +
                recyclingPoints[recycling]
            );

            document.getElementById("co2Result").textContent =
                "Weekly CO2: " + totalCO2.toFixed(2) + " kg";

            document.getElementById("pointsResult").textContent =
                "Eco-Points: " + ecoPoints + " / 100";
        });
    </script>

</body>
</html>
